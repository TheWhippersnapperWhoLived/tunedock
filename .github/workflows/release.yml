name: Release

# Every push to main: a pre-release "build-N" (only the newest 2 are kept).
# Pushing a tag like v0.1.0: a stable release that is kept for good.
on:
  push:
    branches: [main]
    tags: ["v*"]
    # docs and licence edits don't need a 70 MB build (path filters never apply to tag pushes)
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Read the version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path tunedock/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            throw "Tag ${{ github.ref_name }} does not match __version__ $v in tunedock/__init__.py"
          }

      - name: Build Tunedock.exe
        run: python tools/setup_tunedock.py --build-only

      - name: Show the build log if it failed
        if: failure()
        run: Get-Content setup.log -Tail 60

      - name: Package the zip
        id: pack
        shell: pwsh
        run: |
          $short = "${{ github.sha }}".Substring(0, 7)
          $stable = "${{ github.ref_type }}" -eq "tag"
          $name = if ($stable) { "Tunedock-${{ steps.ver.outputs.version }}-windows" } else { "Tunedock-${{ steps.ver.outputs.version }}-$short-windows" }
          New-Item -ItemType Directory -Path "stage/Tunedock" | Out-Null
          Copy-Item "app/*" "stage/Tunedock" -Recurse
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, README.md "stage/Tunedock"
          Compress-Archive -Path "stage/Tunedock" -DestinationPath "$name.zip"
          "zip=$name.zip" >> $env:GITHUB_OUTPUT
          "short=$short" >> $env:GITHUB_OUTPUT

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "${{ steps.pack.outputs.zip }}"
          $short = "${{ steps.pack.outputs.short }}"
          $version = "${{ steps.ver.outputs.version }}"
          $notes = @"
          Built from commit $short.

          **Run it:** unzip anywhere, open ``Tunedock\Tunedock.exe``. No Python needed.
          Windows SmartScreen may warn because the exe is unsigned: *More info > Run anyway*.
          ffmpeg is downloaded by the app the first time you convert music.
          "@
          if ("${{ github.ref_type }}" -eq "tag") {
            gh release create "${{ github.ref_name }}" $zip --verify-tag --latest --title "Tunedock $version" --notes $notes
          } else {
            $tag = "build-${{ github.run_number }}"
            gh release create $tag $zip --target "${{ github.sha }}" --prerelease --title "Build ${{ github.run_number }} ($version, $short)" --notes $notes
          }

      - name: Keep only the newest 2 builds
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $builds = gh release list --limit 100 --json tagName,createdAt | ConvertFrom-Json |
            Where-Object { $_.tagName -like "build-*" } | Sort-Object createdAt -Descending
          foreach ($r in ($builds | Select-Object -Skip 2)) {
            gh release delete $r.tagName --cleanup-tag --yes
            # --cleanup-tag can leave the tag behind, so remove it explicitly too
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$($r.tagName)" 2>$null | Out-Null
          }
          # a draft left behind by an interrupted run never shows in the list above
          gh api "repos/${{ github.repository }}/releases?per_page=100" | ConvertFrom-Json |
            Where-Object { $_.draft -eq $true } |
            ForEach-Object { gh api -X DELETE "repos/${{ github.repository }}/releases/$($_.id)" | Out-Null }
